{{ define "main" }}
  <section class="intro">
    <img class="intro-avatar" src="{{ .Site.Params.avatar | relURL }}" alt="{{ .Site.Params.author }}" width="56" height="56" />
    <div>
      <h1 class="intro-name">{{ .Site.Params.author }}</h1>
      <p class="intro-text">{{ .Site.Params.description }}</p>
    </div>
  </section>

  {{ $posts := where .Site.RegularPages "Section" "posts" }}
  {{ range $posts.GroupByDate "2006" }}
    <section class="year-group">
      <h2 class="year">{{ .Key }}</h2>
      <ul class="post-list">
        {{ range .Pages }}
          {{ partial "post-card.html" . }}
        {{ end }}
      </ul>
    </section>
  {{ end }}
{{ end }}
