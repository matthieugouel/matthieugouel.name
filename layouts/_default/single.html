{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      {{- if ne .Type "page" }}
        {{ partial "post-meta.html" . }}
      {{- end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    {{- if ne .Type "page" }}
    <nav class="post-nav">
      {{ with .PrevInSection }}<a class="post-nav-prev" href="{{ .RelPermalink }}"><span>← Newer</span>{{ .Title }}</a>{{ else }}<span></span>{{ end }}
      {{ with .NextInSection }}<a class="post-nav-next" href="{{ .RelPermalink }}"><span>Older →</span>{{ .Title }}</a>{{ end }}
    </nav>
    {{- end }}
  </article>
{{ end }}
